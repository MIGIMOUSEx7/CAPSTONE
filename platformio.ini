[env:ai_thinker_esp32cam]
platform = espressif32
board = esp32cam
framework = arduino

; Standard speed for ESP32 serial monitoring
monitor_speed = 115200

; Library dependencies for sensors
; Note: esp32-camera is omitted because it is built into the espressif32 platform natively
lib_deps = 
  adafruit/DHT sensor library @ ^1.4.4
  adafruit/Adafruit Unified Sensor @ ^1.1.14